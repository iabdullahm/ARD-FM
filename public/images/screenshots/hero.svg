    <circle cx="294" cy="638" r="6" fill="#DC2626"/>
    <text x="312" y="642" fill="#0F172A" font-family="system-ui, sans-serif" font-size="13" font-weight="700">تسرّب مياه - مبنى A101</text>
    <text x="700" y="642" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">فني: أحمد خ.</text>
