    <text x="312" y="698" fill="#0F172A" font-family="system-ui, sans-serif" font-size="13" font-weight="700">صيانة مكيف - وحدة 204</text>
    <text x="700" y="698" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">فني: سالم م.</text>
    <text x="850" y="698" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">SLA: 5س 02د</text>
    <rect x="1020" y="680" width="80" height="24" rx="12" fill="#FEF3C7"/>
    <text x="1060" y="696" text-anchor="middle" fill="#D97706" font-family="system-ui, sans-serif" font-size="11" font-weight="700">قيد العمل</text>

    <!-- Row 3 -->
