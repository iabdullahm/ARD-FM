  <circle cx="36" cy="186" r="3" fill="#475569"/>
  <circle cx="36" cy="226" r="3" fill="#475569"/>
  <circle cx="36" cy="266" r="3" fill="#475569"/>
  <circle cx="36" cy="306" r="3" fill="#475569"/>
  <circle cx="36" cy="346" r="3" fill="#475569"/>
  <circle cx="36" cy="386" r="3" fill="#475569"/>
  <circle cx="36" cy="426" r="3" fill="#475569"/>

