      <stop offset="1" stop-color="#EEF2F7"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FF7A00"/>
      <stop offset="1" stop-color="#FF9933"/>
    </linearGradient>
    <linearGradient id="bluegrad" x1="0" y1="0" x2="0" y2="1">
